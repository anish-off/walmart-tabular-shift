services:
  - type: web
    name: walmart-tabular-shift-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: python -m uvicorn app:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: src
      - key: PYTHON_VERSION
        value: 3.11.9
